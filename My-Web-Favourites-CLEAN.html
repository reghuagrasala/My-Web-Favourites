<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fb8c5">
<title>My Web Favourites</title>
<style>
*{box-sizing:border-box}
:root{
  --text:#17202a; --muted:rgba(23,32,42,.62);
  --glass:rgba(255,255,255,.34); --border:rgba(255,255,255,.58);
}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}
body{
  min-height:100vh; overflow-x:hidden;
  background:linear-gradient(135deg,#8db8cf,#a9cfc9 48%,#739fae);
  transition:background 1.5s ease;
}
.page{min-height:100vh;padding:22px 24px 105px}
.top{text-align:center;margin:0 auto 22px}
.date{font-size:16px;font-weight:500;color:var(--muted)}
.greeting{font-size:clamp(28px,4vw,44px);font-weight:750;letter-spacing:-1.2px;margin-top:3px}
.title{font-size:25px;font-weight:650;color:rgba(23,32,42,.74);margin-top:3px}
.count{font-size:12px;color:rgba(23,32,42,.48);margin-top:4px}

.folders{
  width:min(1160px,96%);margin:auto;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;
}
.folder{
  min-height:116px;padding:15px;border-radius:22px;
  background:linear-gradient(135deg,var(--folder),rgba(255,255,255,.25));
  border:1px solid var(--border);box-shadow:0 7px 22px rgba(35,55,75,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  cursor:pointer;touch-action:manipulation;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.folder:active{transform:scale(.98)}
.folder-icon{font-size:27px;margin-bottom:5px}
.folder-name{font-size:16px;font-weight:700;line-height:1.2}
.folder-count{font-size:11px;color:rgba(23,32,42,.52);margin-top:5px}

.folder:nth-child(4n+1){--folder:rgba(180,205,235,.45)}
.folder:nth-child(4n+2){--folder:rgba(210,225,190,.43)}
.folder:nth-child(4n+3){--folder:rgba(150,215,190,.46)}
.folder:nth-child(4n+4){--folder:rgba(210,190,235,.43)}

.search-area{
  position:fixed;z-index:50;left:50%;bottom:18px;transform:translateX(-50%);
  width:min(650px,calc(100% - 28px));
}
.search-shell{
  height:53px;display:flex;align-items:center;padding:0 18px;border-radius:28px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.78);
  box-shadow:0 7px 24px rgba(30,50,70,.14);backdrop-filter:blur(18px);
}
.search-icon{font-size:18px;opacity:.55;margin-right:9px}
.search{width:100%;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px}

#shade{
  display:none;position:fixed;inset:0;z-index:90;background:rgba(15,28,40,.25);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
#shade.show{display:block}
#panel{
  display:none;position:fixed;z-index:100;left:50%;top:50%;
  transform:translate(-50%,-50%);width:min(920px,90vw);max-height:82vh;
  overflow:hidden;border-radius:28px;background:rgba(247,251,251,.97);
  box-shadow:0 25px 70px rgba(20,40,60,.30);
}
#panel.show{display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px}
.panel-title{font-size:22px;font-weight:750}
.panel-close{border:0;background:rgba(0,0,0,.07);border-radius:50%;width:36px;height:36px;font-size:21px;cursor:pointer}
.panel-links{
  overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 20px 24px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 12px;
}
.site{
  display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#273442;
  min-width:0;padding:9px 5px;border-radius:14px;
}
.site:active{background:rgba(0,0,0,.05)}
.site img{
  width:54px;height:54px;object-fit:contain;border-radius:13px;background:rgba(255,255,255,.7);
  padding:7px;box-shadow:0 2px 8px rgba(30,50,70,.10)
}
.site-title{width:100%;font-size:11px;font-weight:600;text-align:center;line-height:1.2;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

@media(max-width:850px){.folders{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:580px){
  .page{padding:18px 10px 92px}
  .date{font-size:13px} .greeting{font-size:29px} .title{font-size:19px}
  .folders{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .folder{min-height:86px;padding:10px 8px;border-radius:15px}
  .folder-icon{font-size:22px} .folder-name{font-size:13px}
  #panel{width:94vw;max-height:84vh;border-radius:24px}
  .panel-head{padding:16px 16px 10px} .panel-title{font-size:19px}
  .panel-links{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 5px;padding:8px 10px 22px}
  .site img{width:52px;height:52px}
  .site-title{font-size:10px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="date" id="date"></div>
    <div class="greeting" id="greeting"></div>
    <div class="title">My Web Favourites</div>
    <div class="count">15 folders · 271 links</div>
  </header>
  <main class="folders" id="folders"></main>
</div>

<div class="search-area">
  <div class="search-shell">
    <span class="search-icon">⌕</span>
    <input id="search" class="search" type="search" placeholder="Search the web" autocomplete="off">
  </div>
</div>

<div id="shade"></div>
<section id="panel" aria-modal="true" role="dialog">
  <div class="panel-head">
    <div class="panel-title" id="panelTitle"></div>
    <button class="panel-close" id="panelClose" aria-label="Close">×</button>
  </div>
  <div class="panel-links" id="panelLinks"></div>
</section>

const foldersEl = document.getElementById("folders");
const shade = document.getElementById("shade");
const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panelTitle");
const panelLinks = document.getElementById("panelLinks");

function iconFor(url) {
  try {
    const u = new URL(url), host = u.hostname;
    return [
      u.origin + "/favicon.ico",
      "https://icons.duckduckgo.com/ip3/" + host + ".ico",
      "https://www.google.com/s2/favicons?sz=256&domain=" + encodeURIComponent(host)
    ];
  } catch(e) { return []; }
}

function makeLink(bookmark) {
  const a = document.createElement("a");
  a.className = "site";
  a.href = bookmark.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = bookmark.title;

  const img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  const candidates = iconFor(bookmark.url);
  let i = 0;
  function next() {
    if (i < candidates.length) img.src = candidates[i++];
    else img.style.visibility = "hidden";
  }
  img.onerror = next;
  next();

  const title = document.createElement("div");
  title.className = "site-title";
  title.textContent = bookmark.title;
  a.append(img,title);
  return a;
}

function openFolder(index) {
  const folder = safariBookmarks[index];
  panelTitle.textContent = folder.name;
  panelLinks.replaceChildren();
  folder.links.forEach((b) => panelLinks.appendChild(makeLink(b)));
  panel.classList.add("show");
  shade.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeFolder() {
  panel.classList.remove("show");
  shade.classList.remove("show");
  document.body.style.overflow = "";
}

safariBookmarks.forEach((folder,index) => {
  const card = document.createElement("div");
  card.className = "folder";
  card.innerHTML = '<div class="folder-icon">📁</div>' +
                   '<div class="folder-name"></div>' +
                   '<div class="folder-count"></div>';
  card.querySelector(".folder-name").textContent = folder.name;
  card.querySelector(".folder-count").textContent = folder.links.length + " links";
  card.addEventListener("click", () => openFolder(index));
  foldersEl.appendChild(card);
});

shade.addEventListener("click", closeFolder);
document.getElementById("panelClose").addEventListener("click", closeFolder);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeFolder(); });

document.getElementById("search").addEventListener("keydown", function(e) {
  if(e.key === "Enter" && this.value.trim()) {
    const q = encodeURIComponent(this.value.trim());
    window.location.href = "https://www.google.com/search?q=" + q;
  }
});

function updateWallpaper() {
  const now = new Date(), h = now.getHours();
  document.getElementById("date").textContent = now.toLocaleDateString("en-IN",
    {weekday:"long",day:"numeric",month:"long",year:"numeric"});
  let greeting, bg;
  if(h>=5 && h<12) {
    greeting="Good Morning"; bg="linear-gradient(135deg,#8db8cf,#a9cfc9 48%,#739fae)";
  } else if(h<17) {
    greeting="Good Afternoon"; bg="linear-gradient(135deg,#6f9fbd,#8db9b6 50%,#5d899e)";
  } else if(h<21) {
    greeting="Good Evening"; bg="linear-gradient(135deg,#627fa5,#837caa 52%,#536f8d)";
  } else {
    greeting="Good Night"; bg="linear-gradient(135deg,#344d6a,#465777 52%,#293f59)";
  }
  document.getElementById("greeting").textContent=greeting;
  document.body.style.background=bg;
}
updateWallpaper(); setInterval(updateWallpaper,60000);
</script>
