<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My Safari Favourites</title>
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="My Safari Favourites">
  <meta name="application-name" content="My Safari Favourites">
  <link rel="stylesheet" href="css/style.css?v=20260917">
  
</head>
<body>
  <!-- HOME VIEW -->
  <div class="home-view" id="homeView">
    <div class="header">
      <div class="date" id="dateDisplay">Wednesday, 19 August 2026</div>
    </div>

    <div class="top-bar">
      <div class="favourites-label">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Favourites
      </div>
      <div class="management-actions" aria-label="Bookmark management">
        <button class="management-btn" type="button" onclick="document.getElementById('importInput').click()" title="Import bookmarks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Import
        </button>
        <button class="management-btn" type="button" onclick="refreshBookmarks()" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Refresh
        </button>
        <button class="management-btn" type="button" onclick="exportBookmarks()" title="Export bookmarks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9"/><path d="m17 14-5-5-5 5"/><path d="M5 3h14"/></svg>
          Export
        </button>
      </div>
      <input class="import-input" id="importInput" type="file" accept=".html,.htm,.json,text/html,application/json" onchange="importBookmarks(this.files[0])" />
    </div>

    <div class="folders-grid" id="foldersGrid"></div>

  </div>

  <!-- DETAIL VIEW -->
  <div class="detail-view" id="detailView">
    <div class="detail-header">
      <button class="back-btn" onclick="showHome()" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="detail-title" id="detailTitle"></div>
      <button class="theme-btn" id="themeBtn" onclick="toggleDarkMode()" title="Toggle dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
    <div class="links-grid" id="linksGrid"></div>
  </div>

  <script>
    // ===== BOOKMARKS DATA =====
    // Starts completely empty. Imported bookmarks are kept only in this browser.
    let BOOKMARKS = {};

    // ===== IMPORT / REFRESH / EXPORT =====
    const BOOKMARK_STORAGE_KEY = 'my-safari-favourites-v4';

    function saveBookmarksLocally() {
      try { localStorage.setItem(BOOKMARK_STORAGE_KEY, JSON.stringify(BOOKMARKS)); } catch(e) {}
    }

    function restoreBookmarksLocally() {
      try {
        const saved = JSON.parse(localStorage.getItem(BOOKMARK_STORAGE_KEY) || 'null');
        if (saved && typeof saved === 'object' && !Array.isArray(saved)) BOOKMARKS = saved;
      } catch(e) {}
    }

    function parseImportedBookmarks(text, fileName) {
      const trimmed = text.trim();

      if (fileName.toLowerCase().endsWith('.json') || trimmed.startsWith('{')) {
        const obj = JSON.parse(trimmed);
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
          throw new Error('Invalid bookmark JSON');
        }

        const source = (obj.folders && Array.isArray(obj.folders))
          ? Object.fromEntries(obj.folders.map(f => [String(f.name || 'Imported'), f.links || []]))
          : obj;

        const out = {};
        Object.entries(source).forEach(([folder, links]) => {
          const name = uniqueFolderName(folder, out);
          out[name] = Array.isArray(links)
            ? links.filter(x => x && x.url).map(x => ({
                title: String(x.title || x.url),
                url: String(x.url)
              }))
            : [];
        });

        if (!Object.keys(out).length) throw new Error('No folders found');
        return out;
      }

      const doc = new DOMParser().parseFromString(trimmed, 'text/html');
      const root = doc.querySelector('dl');
      if (!root) throw new Error('No bookmark list found');

      const result = {};

      function walkDL(dl, currentFolder = null) {
        for (const dt of Array.from(dl.children).filter(el => el.tagName === 'DT')) {
          const h3 = Array.from(dt.children).find(el => el.tagName === 'H3');
          const a = Array.from(dt.children).find(el => el.tagName === 'A');
          const nested = Array.from(dt.children).find(el => el.tagName === 'DL');

          if (h3) {
            // Every H3 folder in the imported bookmark file becomes one folder.
            const folderName = uniqueFolderName(h3.textContent.trim(), result);
            result[folderName] = [];
            if (nested) walkDL(nested, folderName);
          } else if (a && a.href) {
            // A bookmark belongs to the nearest containing H3 folder.
            if (!currentFolder) {
              currentFolder = uniqueFolderName('Bookmarks', result);
              if (!result[currentFolder]) result[currentFolder] = [];
            }
            result[currentFolder].push({
              title: a.textContent.trim() || a.href,
              url: a.href
            });
          } else if (nested) {
            // Be tolerant of bookmark files with an unwrapped root DL.
            walkDL(nested, currentFolder);
          }
        }
      }

      walkDL(root);

      if (!Object.keys(result).length) throw new Error('No bookmarks found');
      return result;
    }

    function uniqueFolderName(name, target) {
      let base = String(name || 'Imported').trim() || 'Imported';
      let candidate = base;
      let i = 2;
      while (Object.prototype.hasOwnProperty.call(target, candidate)) {
        candidate = `${base} (${i++})`;
      }
      return candidate;
    }

    function importBookmarks(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          BOOKMARKS = parseImportedBookmarks(String(reader.result || ''), file.name);
          saveBookmarksLocally();
          buildHome();
          setTimeOfDay(new Date());
          alert('Bookmarks imported successfully.');
        } catch (e) {
          alert('Could not import bookmarks. Please choose a Safari/HTML or JSON bookmark file.');
        }
        document.getElementById('importInput').value = '';
      };
      reader.readAsText(file);
    }

    function refreshBookmarks() {
      saveBookmarksLocally();
      restoreBookmarksLocally();
      buildHome();
      updateDate();
      setTimeOfDay(new Date());
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function exportBookmarks() {
      const now = new Date().toISOString();
      let html = '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n';
      html += '<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n';
      html += '<TITLE>My Safari Favourites</TITLE>\n<H1>My Safari Favourites</H1>\n<DL><p>\n';
      Object.entries(BOOKMARKS).forEach(([folder, links]) => {
        html += `    <DT><H3>${escapeHtml(folder)}</H3>\n    <DL><p>\n`;
        (Array.isArray(links) ? links : []).forEach(link => {
          if (link && link.url) html += `        <DT><A HREF="${escapeHtml(link.url)}">${escapeHtml(link.title || link.url)}</A>\n`;
        });
        html += '    </DL><p>\n';
      });
      html += '</DL><p>\n';
      const blob = new Blob([html], {type:'text/html;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `My-Safari-Favourites-${now.slice(0,10)}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // High-quality site icon + page-preview fallback.
    function getHostname(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); }
      catch(e) { return ''; }
    }

    function imageSources(url) {
      const host = getHostname(url);
      if (!host) return [];
      return [
        `https://www.google.com/s2/favicons?domain=${host}&sz=128`,
        `https://icons.duckduckgo.com/ip3/${host}.ico`,
        `https://favicon.yandex.net/favicon/${host}`,
        `https://${host}/favicon.ico`,
        `https://${host}/apple-touch-icon.png`
      ];
    }

    function makeFaviconImg(url) {
      const sources = imageSources(url);
      const letter = firstLetter(getHostname(url) || url);
      if (!sources.length) return `<span class="fallback-letter">${letter}</span>`;
      const fallbackJs = `this.style.display='none';var n=this.nextElementSibling;if(n)n.style.display='flex';`;
      let onerr = fallbackJs;
      for (let i = sources.length - 1; i >= 1; i--) {
        onerr = `this.onerror=null;this.src='${sources[i]}';this.onerror=function(){${onerr}};`;
      }
      return `<img src="${sources[0]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="${onerr}" onload="this.classList.add('loaded')"><span class="fallback-letter" style="display:none">${letter}</span>`;
    }

    function firstLetter(title) {
      const t = String(title).replace(/[^a-zA-Z0-9\u0D00-\u0D7F]/g, '').trim();
      return (t[0] || '?').toUpperCase();
    }

    // Build folder tiles. Keep the preferred order first, then show every
    // additional imported folder so imports never silently hide folders.
    function buildHome() {
      const grid = document.getElementById('foldersGrid');
      grid.innerHTML = '';

      // Render exactly the folders present in BOOKMARKS, in imported order.
      const folders = Object.keys(BOOKMARKS).map(key => ({ key, label: key }));
      const columns = window.matchMedia('(max-width: 599px)').matches ? 4
        : window.matchMedia('(max-width: 899px)').matches ? 6 : 8;
      const rows = Math.max(1, Math.ceil(folders.length / columns));
      grid.style.setProperty('--folder-rows', rows);

      // More folders => smaller tiles; fewer folders => larger tiles.
      const compact = folders.length
        ? Math.max(0.68, Math.min(1, 2.2 / Math.sqrt(rows)))
        : 1;
      grid.style.setProperty('--folder-scale', compact.toFixed(3));

      folders.forEach(f => {
        const links = Array.isArray(BOOKMARKS[f.key]) ? BOOKMARKS[f.key] : [];
        const tile = document.createElement('div');
        tile.className = 'folder-tile';
        tile.onclick = () => openFolder(f.key, f.label);

        let miniHtml = '';
        for (let i = 0; i < 4; i++) {
          if (links[i]) {
            miniHtml += `<div class="mini-icon">${makeFaviconImg(links[i].url)}</div>`;
          } else {
            miniHtml += `<div class="mini-icon"><span>•</span></div>`;
          }
        }

        tile.innerHTML = `
          <div class="folder-icon">${miniHtml}</div>
          <div class="folder-label">${escapeHtml(f.label)}</div>
        `;
        grid.appendChild(tile);
      });
    }

    // Normal HTTPS navigation only. No app-specific URL schemes are used.
    function toBrowserUrl(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes('google.') && (u.pathname.includes('/search') || u.searchParams.has('q'))) {
          u.searchParams.set('client', 'safari');
          if (!u.searchParams.has('udm')) u.searchParams.set('udm', '50');
        }
        if (u.hostname === 'youtu.be') {
          const id = u.pathname.replace(/^\//,'');
          return `https://m.youtube.com/watch?v=${encodeURIComponent(id)}`;
        }
        if (u.hostname === 'youtube.com' || u.hostname === 'www.youtube.com') {
          u.hostname = 'm.youtube.com';
          u.searchParams.delete('app');
        }
        if (u.hostname.includes('maps.google.')) {
          u.hostname = 'www.google.com';
          u.pathname = '/maps' + (u.pathname === '/' ? '' : u.pathname);
        }
        return u.toString();
      } catch(e) { return url; }
    }

    function openExternal(url) {
      const clean = toBrowserUrl(url);
      const a = document.createElement('a');
      a.href = clean;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function openFolder(key, label) {
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('detailView').classList.add('active');
      document.body.classList.add('folder-open');
      document.getElementById('detailTitle').textContent = label;
      applyDarkPreference();

      const grid = document.getElementById('linksGrid');
      grid.innerHTML = '';
      const links = BOOKMARKS[key] || [];

      links.forEach(link => {
        const tile = document.createElement('div');
        tile.className = 'link-tile';
        tile.setAttribute('role','link');
        tile.setAttribute('tabindex','0');
        tile.addEventListener('click', () => openExternal(link.url));
        tile.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openExternal(link.url); }
        });
        tile.innerHTML = `
          <div class="link-icon">${makeFaviconImg(link.url)}</div>
          <div class="link-label">${link.title}</div>
        `;
        grid.appendChild(tile);
      });
      window.scrollTo(0, 0);
    }

    function showHome() {
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('detailView').classList.remove('active');
      document.body.classList.remove('folder-open');
      window.scrollTo(0, 0);
    }

    // Dark mode for the links / folder detail view
    function toggleDarkMode() {
      const view = document.getElementById('detailView');
      view.classList.toggle('dark-mode');
      // Remember preference
      try {
        localStorage.setItem('fav-dark', view.classList.contains('dark-mode') ? '1' : '0');
      } catch(e) {}
    }

    // Restore dark preference when opening a folder
    function applyDarkPreference() {
      try {
        if (localStorage.getItem('fav-dark') === '1') {
          document.getElementById('detailView').classList.add('dark-mode');
        }
      } catch(e) {}
    }

    // Date + dynamic wallpaper based on local solar time.
    function updateDate() {
      const now = new Date();
      const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-IN', opts);
      setTimeOfDay(now);
    }

    function solarHours(date, lat, lon) {
      const day = Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()) -
        Date.UTC(date.getFullYear(),0,0)) / 86400000);
      const gamma = 2*Math.PI/365*(day-1);
      const decl = 0.006918 - 0.399912*Math.cos(gamma) + 0.070257*Math.sin(gamma)
        - 0.006758*Math.cos(2*gamma) + 0.000907*Math.sin(2*gamma)
        - 0.002697*Math.cos(3*gamma) + 0.00148*Math.sin(3*gamma);
      const eq = 229.18*(0.000075 + 0.001868*Math.cos(gamma) - 0.032077*Math.sin(gamma)
        - 0.014615*Math.cos(2*gamma) - 0.040849*Math.sin(2*gamma));
      const zen = 90.833*Math.PI/180;
      const ha = Math.acos((Math.cos(zen)/(Math.cos(lat*Math.PI/180)*Math.cos(decl))
        - Math.tan(lat*Math.PI/180)*Math.tan(decl)));
      const noon = 12 - lon/15 + 5.5 - eq/60;
      const h = ha*180/Math.PI/15;
      return { sunrise:noon-h, sunset:noon+h };
    }

    function setTimeOfDay(now) {
      const apply = (lat,lon) => {
        const solar = solarHours(now,lat,lon);
        const hour = now.getHours()+now.getMinutes()/60;
        let cls = 'time-noon';
        if (hour < solar.sunrise + 1.5) cls = 'time-morning';
        else if (hour >= solar.sunset - 1.0 && hour < solar.sunset + 0.75) cls = 'time-sunset';
        else if (hour >= solar.sunset + 0.75 || hour < solar.sunrise) cls = 'time-night';
        document.documentElement.classList.remove('time-morning','time-noon','time-sunset','time-night');
        document.documentElement.classList.add(cls);
      };
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => apply(pos.coords.latitude,pos.coords.longitude),
          () => apply(10.3,76.4),
          {maximumAge:86400000, timeout:2500}
        );
      } else apply(10.3,76.4);
    }

    restoreBookmarksLocally();
    updateDate();
    buildHome();
    applyDarkPreference();
  </script>
</body>
</html>
