<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My Safari Favourites</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-start:#1a4a7a; --bg-mid:#2a6a9a; --bg-end:#3a8a7a; --tile-bg:rgba(40,50,70,.55); --tile-border:rgba(255,255,255,.12); --text:#fff; --text-dim:rgba(255,255,255,.78); }
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#183a63 center center/cover no-repeat fixed;transition:background 1.2s ease;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
    html.time-morning body{background:linear-gradient(145deg,#536f8a 0%,#7e93a8 45%,#b4bdc7 100%)} html.time-noon body{background:linear-gradient(145deg,#1260a0 0%,#2f86c1 48%,#78b9d6 100%)} html.time-sunset body{background:linear-gradient(145deg,#385b82 0%,#c37a59 52%,#f0b46d 100%)} html.time-night body{background:linear-gradient(145deg,#050b18 0%,#0c1930 48%,#182d48 100%)}
    body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(10,30,50,.35) 0%,rgba(10,40,50,.45) 100%);z-index:-1;pointer-events:none}
    body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
    .header{text-align:center;padding:18px 8px 8px;position:relative}.date{font-size:clamp(1.35rem,4.5vw,1.85rem);font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.25)}
    .top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 14px;max-width:920px;margin:0 auto;width:100%}.favourites-label{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;opacity:.95}.favourites-label svg{width:18px;height:18px;opacity:.9}
    .refresh-btn{background:none;border:none;color:white;font-size:14px;font-weight:500;opacity:.85;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px}.refresh-btn:active{opacity:1;background:rgba(255,255,255,.1)}
    .folders-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;max-width:920px;margin:0 auto;width:100%;padding:4px 2px 24px;flex:1}
    @media(max-width:599px){.home-view{height:calc(100dvh - 76px);min-height:0;display:flex;flex-direction:column;overflow:hidden}.folders-grid{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}}
    @media(min-width:600px){.folders-grid{grid-template-columns:repeat(6,1fr);gap:20px 14px}} @media(min-width:900px){.folders-grid{grid-template-columns:repeat(8,1fr)}}
    .folder-tile{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:white;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}.folder-tile:active{transform:scale(.94)}
    .folder-icon{width:72px;height:72px;border-radius:16px;background:var(--tile-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--tile-border);box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:7px;overflow:hidden;margin-bottom:8px}
    @media(max-width:380px){.folder-icon{width:64px;height:64px;border-radius:14px;padding:6px}} .mini-icon{border-radius:6px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#222;overflow:hidden;position:relative}.mini-icon img{width:100%;height:100%;object-fit:contain;background:#fff}.mini-icon .fallback-letter,.mini-icon span{font-size:11px;line-height:1;text-align:center;font-weight:700;color:#333}
    .folder-label{font-size:11.5px;font-weight:500;text-align:center;line-height:1.25;max-width:84px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 3px rgba(0,0,0,.3);opacity:.95}
    .detail-view{display:none;flex-direction:column;max-width:920px;margin:0 auto;width:100%;flex:1;padding-bottom:20px}.detail-view.active{display:flex}.detail-view.dark-mode{background:rgba(12,14,20,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;margin-top:8px;padding:12px 10px 24px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
    .detail-view.dark-mode .link-icon{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15)}.detail-view.dark-mode .link-icon .fallback-letter{color:#eee}.detail-view.dark-mode .link-label{opacity:.9}.detail-view.dark-mode .back-btn,.detail-view.dark-mode .theme-btn{background:rgba(255,255,255,.12)}
    .detail-header{display:flex;align-items:center;gap:10px;padding:8px 4px 16px}.back-btn,.theme-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.25);border:none;color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}.back-btn:active,.theme-btn:active{background:rgba(0,0,0,.4)}.detail-title{font-size:1.25rem;font-weight:600;flex:1;text-shadow:0 1px 4px rgba(0,0,0,.2)}
    .links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;padding:4px 2px}@media(min-width:600px){.links-grid{grid-template-columns:repeat(6,1fr);gap:18px 12px}}@media(min-width:900px){.links-grid{grid-template-columns:repeat(8,1fr)}}
    .link-tile{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:white;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}.link-tile:active{transform:scale(.93)}.link-icon{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--tile-border);box-shadow:0 3px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;margin-bottom:7px;overflow:hidden}.link-icon img{width:100%;height:100%;object-fit:cover;border-radius:13px;background:#fff;transition:opacity .25s ease}.link-icon img:not(.loaded){opacity:.35}.link-icon .fallback-letter{font-size:20px;font-weight:600;color:#333}.link-label{font-size:11px;font-weight:500;text-align:center;line-height:1.2;max-width:76px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 3px rgba(0,0,0,.3);opacity:.93}
    .sync-area{display:none}
  </style>
</head>
<body>
  <div class="header"><div class="date" id="dateDisplay"></div></div>
  <div class="top-bar"><div class="favourites-label"><span>⭐</span><span>Favourites</span></div></div>
  <div id="homeView" class="home-view"><div id="foldersGrid" class="folders-grid"></div></div>
  <div id="detailView" class="detail-view"><div class="detail-header"><button class="back-btn" onclick="showHome()" aria-label="Back">‹</button><div id="detailTitle" class="detail-title"></div><button class="theme-btn" onclick="toggleDarkMode()" aria-label="Dark mode">☾</button></div><div id="linksGrid" class="links-grid"></div></div>
  <script src="bookmarks.js"></script>
  <script>
    const DEFAULT_BOOKMARKS = window.__DEFAULT_BOOKMARKS__ || {};
    const BOOKMARKS = window.__IMPORTED_BOOKMARKS__ || DEFAULT_BOOKMARKS;
    const importedOrder = window.__IMPORTED_FOLDER_ORDER__ || [];
    const fallbackOrder = ['ഇന്നത്തെ വിശേഷം','മലയാളം വാർത്ത','English News','Radio, TV, OTT, Audiobooks','Social Media','Information and Technology','iOS links','Utilities and tools','AI Tools','Downloader links','State Govt links','Central Govt links','Accounts and Payments','Online Markets'];
    const FOLDER_ORDER = (importedOrder.length ? importedOrder : fallbackOrder).map(name=>({key:name,label:name}));
    function getHostname(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch(e){return ''}}
    function imageSources(url){const host=getHostname(url);if(!host)return [];const encoded=encodeURIComponent(url);return [`https://${host}/favicon.ico`,`https://icons.duckduckgo.com/ip3/${host}.ico`,`https://www.google.com/s2/favicons?domain=${host}&sz=128`,`https://favicon.yandex.net/favicon/${host}`,`https://image.thum.io/get/width/160/crop/120/noanimate/${encoded}`]}
    function firstLetter(title){const t=String(title).replace(/[^a-zA-Z0-9\u0D00-\u0D7F]/g,'').trim();return(t[0]||'?').toUpperCase()}
    function makeFaviconImg(url){const sources=imageSources(url);if(!sources.length)return `<span class="fallback-letter">${firstLetter(url)}</span>`;let attrs=`src="${sources[0]}" alt="" loading="lazy" decoding="async"`;for(let i=1;i<sources.length;i++)attrs+=` onerror="this.onerror=null;this.src='${sources[i]}'"`;return `<img ${attrs} onload="this.classList.add('loaded')"><span class="fallback-letter" style="display:none">${firstLetter(getHostname(url)||url)}</span>`}
    function buildHome(){const grid=document.getElementById('foldersGrid');grid.innerHTML='';FOLDER_ORDER.forEach(f=>{const links=BOOKMARKS[f.key]||[];const tile=document.createElement('div');tile.className='folder-tile';tile.onclick=()=>openFolder(f.key,f.label);let miniHtml='';for(let i=0;i<4;i++)miniHtml+=links[i]?`<div class="mini-icon">${makeFaviconImg(links[i].url)}</div>`:`<div class="mini-icon"><span>•</span></div>`;tile.innerHTML=`<div class="folder-icon">${miniHtml}</div><div class="folder-label">${f.label}</div>`;grid.appendChild(tile)})}
    function toBrowserUrl(url){try{const u=new URL(url);if(u.hostname==='youtu.be'){const id=u.pathname.replace(/^\//,'');return `https://m.youtube.com/watch?v=${encodeURIComponent(id)}`}if(u.hostname==='youtube.com'||u.hostname==='www.youtube.com'){u.hostname='m.youtube.com';u.searchParams.delete('app')}if(u.hostname.includes('maps.google.')){u.hostname='www.google.com';u.pathname='/maps'+(u.pathname==='/'?'':u.pathname)}return u.toString()}catch(e){return url}}
    function openExternal(url){window.location.assign(toBrowserUrl(url))}
    function openFolder(key,label){document.getElementById('homeView').classList.add('hidden');document.getElementById('detailView').classList.add('active');document.getElementById('detailTitle').textContent=label;applyDarkPreference();const grid=document.getElementById('linksGrid');grid.innerHTML='';(BOOKMARKS[key]||[]).forEach(link=>{const tile=document.createElement('div');tile.className='link-tile';tile.setAttribute('role','link');tile.setAttribute('tabindex','0');tile.addEventListener('click',()=>openExternal(link.url));tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openExternal(link.url)}});tile.innerHTML=`<div class="link-icon">${makeFaviconImg(link.url)}</div><div class="link-label">${link.title}</div>`;grid.appendChild(tile)});window.scrollTo(0,0)}
    function showHome(){document.getElementById('homeView').classList.remove('hidden');document.getElementById('detailView').classList.remove('active');window.scrollTo(0,0)}
    function toggleDarkMode(){const view=document.getElementById('detailView');view.classList.toggle('dark-mode');try{localStorage.setItem('fav-dark',view.classList.contains('dark-mode')?'1':'0')}catch(e){}}
    function applyDarkPreference(){try{if(localStorage.getItem('fav-dark')==='1')document.getElementById('detailView').classList.add('dark-mode')}catch(e){}}
    function updateDate(){const now=new Date();document.getElementById('dateDisplay').textContent=now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});setTimeOfDay(now)}
    function solarHours(date,lat,lon){const day=Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(date.getFullYear(),0,0))/86400000);const gamma=2*Math.PI/365*(day-1);const decl=.006918-.399912*Math.cos(gamma)+.070257*Math.sin(gamma)-.006758*Math.cos(2*gamma)+.000907*Math.sin(2*gamma)-.002697*Math.cos(3*gamma)+.00148*Math.sin(3*gamma);const eq=229.18*(.000075+.001868*Math.cos(gamma)-.032077*Math.sin(gamma)-.014615*Math.cos(2*gamma)-.040849*Math.sin(2*gamma));const zen=90.833*Math.PI/180;const ha=Math.acos(Math.cos(zen)/(Math.cos(lat*Math.PI/180)*Math.cos(decl))-Math.tan(lat*Math.PI/180)*Math.tan(decl));const noon=12-lon/15+5.5-eq/60;const h=ha*180/Math.PI/15;return{sunrise:noon-h,sunset:noon+h}}
    function setTimeOfDay(now){const apply=(lat,lon)=>{const solar=solarHours(now,lat,lon);const hour=now.getHours()+now.getMinutes()/60;let cls='time-noon';if(hour<solar.sunrise+1.5)cls='time-morning';else if(hour>=solar.sunset-1&&hour<solar.sunset+.75)cls='time-sunset';else if(hour>=solar.sunset+.75||hour<solar.sunrise)cls='time-night';document.documentElement.classList.remove('time-morning','time-noon','time-sunset','time-night');document.documentElement.classList.add(cls)};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>apply(pos.coords.latitude,pos.coords.longitude),()=>apply(10.3,76.4),{maximumAge:86400000,timeout:2500});else apply(10.3,76.4)}
    const searchForm=document.getElementById('searchForm'); if(searchForm)searchForm.addEventListener('submit',function(e){e.preventDefault()});
    updateDate();buildHome();applyDarkPreference();
  </script>
</body>
</html>
